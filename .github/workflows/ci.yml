name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    uses: ./.github/workflows/ci-job.yml
    secrets: inherit
    with:
      name: format
      command: pnpm format:check

  lint:
    uses: ./.github/workflows/ci-job.yml
    secrets: inherit
    with:
      name: lint
      command: pnpm lint

  test:
    uses: ./.github/workflows/ci-job.yml
    secrets: inherit
    with:
      name: test
      command: pnpm test:ci

  build-web:
    uses: ./.github/workflows/ci-job.yml
    secrets: inherit
    with:
      name: build-web
      command: pnpm --filter @mood-trip/validators build && pnpm --filter @mood-trip/web build

  review:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    needs: [format, lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: PR Review with Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          track_progress: true

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this PR for correctness bugs and reuse/simplification/efficiency
            issues. Provide inline comments on specific lines for concrete issues,
            and a short top-level summary. Skip nitpicks and stylistic preferences
            with no functional impact.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
